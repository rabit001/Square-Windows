name: Square Desktop - Windows

on:
  push:
    branches:
      - "desktop/**"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test desktop shell
        shell: pwsh
        run: .\gradlew.bat -p desktop clean test build --stacktrace

      - name: Package Windows installer
        shell: pwsh
        run: .\gradlew.bat -p desktop packageExe --stacktrace

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: square-desktop-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14
