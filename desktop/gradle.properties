# Keep the separate desktop build usable on an 8 GB development machine.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# The desktop build compiles the vendored InnerTube model/parser sources as JVM code.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
kotlin.code.style=official
